# File read with path arg — no optional args.
id: single_read_file
description: Model calls read_file with just a file path string.
tags: [single_tool, required_arg, filesystem]

messages:
  - role: user
    content: "Read the contents of /etc/hostname."

tools:
  - type: function
    function:
      name: read_file
      description: Read a file from the filesystem.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: Absolute or relative file path.
          encoding:
            type: string
            enum: [utf-8, latin-1, ascii]
            description: File encoding (default utf-8).
        required: [path]

expect:
  tool_calls:
    count: 1
    name: read_file
    required_args: [path]
    arg_predicates:
      path:
        type: string
        pattern: "^/"
