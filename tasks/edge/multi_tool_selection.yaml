# Model has multiple tools; must select the correct one.
id: edge_multi_tool_selection
description: >
  Three tools available; model must pick the single most appropriate one
  (book_flight) without calling the others.
tags: [edge_case, tool_selection, single_tool]

messages:
  - role: user
    content: "Book me a round-trip flight from Dublin to Lisbon in July."

tools:
  - type: function
    function:
      name: book_flight
      description: Book an airline flight ticket.
      parameters:
        type: object
        properties:
          origin:
            type: string
          destination:
            type: string
          trip_type:
            type: string
            enum: [one_way, round_trip]
          month:
            type: string
        required: [origin, destination, trip_type]

  - type: function
    function:
      name: book_hotel
      description: Book a hotel room.
      parameters:
        type: object
        properties:
          city:
            type: string
          check_in:
            type: string
          check_out:
            type: string
        required: [city, check_in, check_out]

  - type: function
    function:
      name: rent_car
      description: Rent a car.
      parameters:
        type: object
        properties:
          city:
            type: string
          days:
            type: integer
        required: [city, days]

expect:
  tool_calls:
    count: 1
    name: book_flight
    required_args: [origin, destination, trip_type]
    arg_predicates:
      trip_type:
        enum: [one_way, round_trip]
