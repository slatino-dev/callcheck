# Special chars in string — backslash, quotes, angle brackets.
id: edge_special_chars_string
description: >
  String arg contains special characters (quotes, backslash, angle brackets)
  that must be properly JSON-escaped.
tags: [edge_case, escaping, string_discipline]

messages:
  - role: user
    content: >
      Execute a shell command: echo "Hello \"World\"" > /tmp/out.txt

tools:
  - type: function
    function:
      name: run_shell
      description: Run a shell command.
      parameters:
        type: object
        properties:
          command:
            type: string
        required: [command]

expect:
  tool_calls:
    count: 1
    name: run_shell
    required_args: [command]
    arg_predicates:
      command:
        type: string
