name: CI

on:
  push:
    branches: ["main", "build/**"]
  pull_request:
    branches: ["main"]
  # Weekly schedule to catch regressions against dependency updates.
  # schedule:
  #   - cron: "0 6 * * 1"   # Monday 06:00 UTC

jobs:
  scrub:
    name: Scrub secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scrub_check
        run: python scripts/scrub_check.py --path .

  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    needs: scrub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: mypy
        run: mypy callcheck/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: scrub
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
