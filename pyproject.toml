[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callcheck"
version = "0.1.0"
description = "Tool-calling and structured-output conformance testing for vLLM-served models."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sam Latino", email = "Latinosammy2@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "httpx>=0.27",   # also needed for TestClient in mockserver tests
]

[project.scripts]
callcheck = "callcheck.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["callcheck"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is fine in tests

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["mockserver/", "scripts/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
